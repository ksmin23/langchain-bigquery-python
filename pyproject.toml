[project]
name = "langchain-bigquery"
dynamic = ["version"]
description = "LangChain integrations for Google Cloud BigQuery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Unknown"}
]
dependencies = [
    "langchain-core>=1.0.0, <2.0.0",
    "langchain>=1.0.0, <2.0.0",
    "langchain-community>=0.4.0, <1.0.0",
    "langchain-google-community[featurestore]>=3.0.0, <4.0.0",
    "google-cloud-bigquery>=3.21.0, <4.0.0",
    "pydantic>=2.0, <3.0.0",
    "numpy>=1.26.0, <3.0.0",
    "requests",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.setuptools.dynamic]
version = {attr = "langchain_bigquery.version.__version__"}

[project.urls]
Homepage = "https://github.com/ksmin23/langchain-bigquery-python"
Repository = "https://github.com/ksmin23/langchain-bigquery-python.git"

[project.optional-dependencies]
lint = [
    "black[jupyter]==24.10.0",
    "flake8==6.1.0",
    "isort==5.13.2",
]

test = [
    "black[jupyter]==24.10.0",
    "flake8==6.1.0",
    "isort==5.13.2",
    "mypy==1.17.0",
    "pytest==8.4.1",
    "pytest-asyncio==0.26.0",
    "pytest-cov==5.0.0",
    "pytest-mock>=3.0",
    "langchain_google_vertexai==2.0.27",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.black]
target-version = ['py310']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true

exclude = [
    'docs/*',
]

[tool.pytest.ini_options]
markers = [
    "integration: mark tests as integration tests requiring BigQuery access",
]
